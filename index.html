
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Olimpo Ventas</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      color: #172033;
    }
    header {
      background: #172554;
      color: white;
      padding: 25px 20px;
    }
    header h1 { margin: 0; }
    main { padding: 20px; }
    .card {
      background: white;
      padding: 20px;
      border-radius: 14px;
      margin-bottom: 15px;
      box-shadow: 0 2px 8px #0001;
    }
    .card h2 { margin-top: 0; }
    button {
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 9px;
      padding: 14px;
      width: 100%;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <header>
    <h1>OLIMPO VENTAS</h1>
    <p>Gestión comercial</p>
  </header>
  <main>
    <div class="card">
      <h2>Bienvenido</h2>
      <p>Panel de gestión de ventas y distribución.</p>
    </div>
    <div class="card">
      <h2>Clientes</h2>
      <button>Ver clientes</button>
    </div>
    <div class="card">
      <h2>Pedidos</h2>
      <button>Nuevo pedido</button>
    </div>
    <div class="card">
      <h2>Mis ventas</h2>
      <button>Ver ventas</button>
    </div>
  </main>
</body>
</html>
